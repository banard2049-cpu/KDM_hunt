name: Android Release APK

# Builds an offline single-machine Android APK from the static web app using
# Capacitor, then publishes the APK to a GitHub Release.
#
# Triggers:
#   - workflow_dispatch (manual, "Run workflow" button)
#   - pushing a tag like v1.0.0 (auto-creates/updates a Release)
#   - pushing to main (builds but does NOT publish a Release)
#   - NOTE: assets-v* tags do NOT trigger builds (they're for asset storage only)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
      - '!assets-v*'  # Exclude assets-v* tags
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Capacitor deps
        run: npm install

      - name: Download game assets
        run: node scripts/download-assets.cjs
        env:
          # Use the assets-v1 release by default
          ASSETS_RELEASE_TAG: assets-v1
          # Pass GitHub token for API authentication (higher rate limits)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: use custom URL if needed
          # ASSETS_URL: https://example.com/kdm-hunt-assets.tar.gz

      - name: Check hunt features
        run: npm test

      # --- Stage a clean web root -------------------------------------------------
      # The web app's assets and data live at the repository root. Capacitor
      # copies "www" into the APK, so stage only what the running UI needs:
      # index.html + assets/ + data/. Never bundle .git or the python launcher.
      - name: Stage web bundle (www)
        run: |
          npm run web:stage

      - name: Verify loot.json was staged
        run: |
          if [ -f www/data/loot.json ]; then
            SIZE=$(wc -c < www/data/loot.json)
            echo "✓ loot.json found in www/data/ (${SIZE} bytes)"
          else
            echo "ERROR: loot.json not found in www/data/"
            ls -la www/data/ || echo "www/data/ directory not found"
            exit 1
          fi

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets into the Android project
        run: npx cap sync android

      - name: Verify loot.json in Android assets
        run: |
          if [ -f android/app/src/main/assets/public/data/loot.json ]; then
            SIZE=$(wc -c < android/app/src/main/assets/public/data/loot.json)
            echo "✓ loot.json found in Android assets (${SIZE} bytes)"
          else
            echo "ERROR: loot.json not found in Android assets"
            find android/app/src/main/assets -name "*.json" | head -10
            exit 1
          fi

      # Replace Capacitor's default launcher artwork with the project icon.
      - name: Install Android launcher icons
        run: cp -R android-res/* android/app/src/main/res/

      # CI runners normally create a new debug key for every build, which makes
      # Android reject upgrades. Configure the project-scoped development key so
      # all future APKs share the same signature.
      - name: Configure stable development signing
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")
          text = path.read_text(encoding="utf-8")
          marker = "android {"
          signing = '''android {
              signingConfigs {
                  debug {
                      storeFile file("../../android-signing/kdm-hunt-dev.p12")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                      storeType "PKCS12"
                  }
              }'''
          if marker not in text:
              raise SystemExit("android block not found in app/build.gradle")
          path.write_text(text.replace(marker, signing, 1), encoding="utf-8")
          PY

      # Large JSON files (loot.json is 734KB) cannot be read by WebView fetch API
      # when compressed by aapt. Prevent compression for all JSON assets.
      - name: Fix Android asset compression for large JSON files
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle")
          text = path.read_text(encoding="utf-8")

          # Check if already applied
          if "noCompress 'json'" in text:
              print("noCompress directive already present, skipping")
              exit(0)

          # Find the aaptOptions block and add noCompress
          # Match: ignoreAssetsPattern = '...'
          pattern = r"(ignoreAssetsPattern\s*=\s*'[^']*')"
          match = re.search(pattern, text)

          if not match:
              raise SystemExit("ERROR: ignoreAssetsPattern not found in build.gradle")

          # Get the indentation from the ignoreAssetsPattern line
          line_start = text.rfind('\n', 0, match.start()) + 1
          indent = text[line_start:match.start()]

          # Insert noCompress directive after ignoreAssetsPattern
          insert_pos = match.end()
          nocompress_lines = f"\n{indent}// Prevent compression of JSON files to allow WebView fetch API to read large data files\n{indent}noCompress 'json'"

          new_text = text[:insert_pos] + nocompress_lines + text[insert_pos:]
          path.write_text(new_text, encoding="utf-8")
          print("Successfully added noCompress 'json' directive")
          PY

      - name: Verify noCompress directive was applied
        run: |
          if grep -q "noCompress 'json'" android/app/build.gradle; then
            echo "✓ noCompress directive confirmed in build.gradle"
            echo "Relevant section:"
            grep -A2 -B2 "noCompress" android/app/build.gradle
          else
            echo "ERROR: noCompress directive not found in build.gradle!"
            exit 1
          fi

      # Capacitor's template ships versionCode 1; without a bump, sideloading a
      # newer build over an old install is rejected ("app not installed").
      - name: Bump versionCode / versionName for this build
        run: npm run android:version

      - name: Set up Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install required Android SDK packages
        run: sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" >/dev/null

      # Debug variant signed with the stable project development key above.
      - name: Build debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Locate APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk/debug -name '*.apk' | head -1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "APK found: $APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kdm-hunt-apk
          path: ${{ steps.apk.outputs.path }}

      - name: Create / update GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          APK="${{ steps.apk.outputs.path }}"
          BASE="kdm-hunt-${TAG}.apk"
          # Create the release if missing (reuse if it already exists).
          gh release create "$TAG" \
            --title "KDM狩猎辅助 $TAG" \
            --notes-file "release-notes/$TAG.md" \
            || true
          # Attach the APK under a stable, versioned file name (idempotent).
          gh release upload "$TAG" "$APK#$BASE" --clobber
